<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daivik Purani - Minimal Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Light Theme */
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #999999;
            --accent: #000000;
            --border: #e5e5e5;
            --transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #0f0f0f;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-tertiary: #666666;
            --accent: #ffffff;
            --border: #2a2a2a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-primary);
            background-color: var(--bg-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: var(--transition);
        }

        /* Minimal Header */
        .minimal-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
            border-bottom: 1px solid transparent;
            transition: var(--transition);
        }

        .minimal-header.scrolled {
            border-bottom-color: var(--border);
            backdrop-filter: blur(8px);
        }

        .logo {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-primary);
            transition: var(--transition);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--text-primary), transparent);
            opacity: 0.02;
            border-radius: 50%;
            filter: blur(60px);
            animation: float 20s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, transparent, var(--text-primary));
            opacity: 0.02;
            border-radius: 50%;
            filter: blur(60px);
            animation: float 25s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, -30px) rotate(180deg); }
        }

        /* Name - Ultra Large and Bold */
        .hero-name {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text-primary);
            margin: 0;
            margin-bottom: 1rem;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Subtitle - Rotating Roles */
        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            min-height: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .role-text {
            display: inline-block;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Description */
        .hero-description {
            font-size: clamp(0.875rem, 1.5vw, 1.125rem);
            color: var(--text-tertiary);
            max-width: 600px;
            margin: 0 auto 4rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        /* Minimal Actions */
        .hero-actions {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .action-link {
            position: relative;
            font-size: 1rem;
            color: var(--text-primary);
            text-decoration: none;
            padding-bottom: 2px;
            transition: color 0.3s ease;
        }

        .action-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .action-link:hover::after {
            width: 100%;
        }

        .action-link:hover {
            color: var(--accent);
        }

        /* Social Links */
        .hero-social {
            display: flex;
            gap: 1.5rem;
            margin-top: 4rem;
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .social-link {
            color: var(--text-secondary);
            font-size: 1.25rem;
            text-decoration: none;
            transition: var(--transition);
            padding: 0.5rem;
            border-radius: 8px;
        }

        .social-link:hover {
            color: var(--accent);
            background: var(--bg-secondary);
            transform: translateY(-2px);
        }

        /* Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.5;
            animation: bounce 2s infinite;
        }

        .scroll-indicator svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-secondary);
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        /* Utility Classes */
        .fade-in {
            animation: fadeInUp 0.8s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-actions {
                flex-direction: column;
                gap: 1.5rem;
            }

            .hero-name {
                font-size: 3rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .minimal-header {
                padding: 1rem;
            }
        }

        /* No smooth scroll for demo */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body data-theme="light">
    <!-- Minimal Header -->
    <header class="minimal-header" id="header">
        <a href="#" class="logo">Daivik Purani</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <span id="themeIcon">🌙</span>
        </button>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <h1 class="hero-name">Daivik Purani</h1>
        
        <div class="hero-subtitle">
            <span class="role-text" id="roleText">Software Engineer @ AWS TimestreamDB</span>
        </div>

        <p class="hero-description">
            Building distributed systems at scale. 
            Currently working on AWS TimestreamDB with expertise in distributed systems architecture, 
            Kafka pipelines, and database optimization.
        </p>

        <div class="hero-actions">
            <a href="#about" class="action-link">About</a>
            <a href="#projects" class="action-link">Projects</a>
            <a href="#contact" class="action-link">Contact</a>
        </div>

        <div class="hero-social">
            <a href="https://github.com/daivikpurani" target="_blank" class="social-link" aria-label="GitHub">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
            </a>
            <a href="https://linkedin.com/in/daivikpurani" target="_blank" class="social-link" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg>
            </a>
            <a href="mailto:daivik.purani@gmail.com" class="social-link" aria-label="Email">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
            </a>
        </div>

        <div class="scroll-indicator">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </section>

    <!-- Theme Toggle Script -->
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.textContent = newTheme === 'light' ? '🌙' : '☀️';
        });

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeIcon.textContent = savedTheme === 'light' ? '🌙' : '☀️';

        // Rotating Roles
        const roles = [
            'Software Engineer @ AWS TimestreamDB',
            'Distributed Systems Architect',
            'Backend Engineer',
            'Database Systems Expert'
        ];

        let currentRole = 0;
        const roleText = document.getElementById('roleText');

        function rotateRole() {
            roleText.style.opacity = '0';
            setTimeout(() => {
                currentRole = (currentRole + 1) % roles.length;
                roleText.textContent = roles[currentRole];
                roleText.style.opacity = '1';
            }, 300);
        }

        setInterval(rotateRole, 4000);

        // Header scroll effect
        let lastScroll = 0;
        const header = document.getElementById('header');

        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            
            if (currentScroll > 100) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
            
            lastScroll = currentScroll;
        });
    </script>
</body>
</html>
